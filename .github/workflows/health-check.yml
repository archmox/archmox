name: Fleet Health Check

on:
  schedule:
    # Run every 30 minutes (matching the worker's cron trigger)
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      notify:
        description: 'Send notifications even if all healthy'
        required: false
        type: boolean
        default: false

concurrency:
  group: health-check
  cancel-in-progress: false

jobs:
  check-fleet:
    name: Check All Fleet Services
    runs-on: ubuntu-latest
    outputs:
      all_healthy: ${{ steps.assess.outputs.all_healthy }}
      summary: ${{ steps.assess.outputs.summary }}
      main_status: ${{ steps.assess.outputs.main_status }}
      main_ms: ${{ steps.assess.outputs.main_ms }}
      pve_status: ${{ steps.assess.outputs.pve_status }}
      pve_ms: ${{ steps.assess.outputs.pve_ms }}
      pbs_status: ${{ steps.assess.outputs.pbs_status }}
      pbs_ms: ${{ steps.assess.outputs.pbs_ms }}
      pmg_status: ${{ steps.assess.outputs.pmg_status }}
      pmg_ms: ${{ steps.assess.outputs.pmg_ms }}
      docs_status: ${{ steps.assess.outputs.docs_status }}
      docs_ms: ${{ steps.assess.outputs.docs_ms }}
      cdn_status: ${{ steps.assess.outputs.cdn_status }}
      cdn_ms: ${{ steps.assess.outputs.cdn_ms }}
    steps:
      - name: Check main site
        id: main
        run: |
          START=$(date +%s%N)
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            --connect-timeout 10 \
            https://archmox.acreetionos.org/ || echo "000")
          END=$(date +%s%N)
          MS=$(( (END - START) / 1000000 ))
          STATUS=$([ "$HTTP_CODE" = "200" ] && echo "up" || echo "down")
          echo "main:${STATUS}:${MS}" >> "$GITHUB_WORKSPACE/.hc-results"

      - name: Check PVE
        run: |
          START=$(date +%s%N)
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            --connect-timeout 10 \
            https://pve.archmox.acreetionos.org/ || echo "000")
          END=$(date +%s%N)
          MS=$(( (END - START) / 1000000 ))
          STATUS=$([ "$HTTP_CODE" = "200" ] && echo "up" || echo "down")
          echo "pve:${STATUS}:${MS}" >> "$GITHUB_WORKSPACE/.hc-results"

      - name: Check PBS
        run: |
          START=$(date +%s%N)
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            --connect-timeout 10 \
            https://pbs.archmox.acreetionos.org/ || echo "000")
          END=$(date +%s%N)
          MS=$(( (END - START) / 1000000 ))
          STATUS=$([ "$HTTP_CODE" = "200" ] && echo "up" || echo "down")
          echo "pbs:${STATUS}:${MS}" >> "$GITHUB_WORKSPACE/.hc-results"

      - name: Check PMG
        run: |
          START=$(date +%s%N)
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            --connect-timeout 10 \
            https://pmg.archmox.acreetionos.org/ || echo "000")
          END=$(date +%s%N)
          MS=$(( (END - START) / 1000000 ))
          STATUS=$([ "$HTTP_CODE" = "200" ] && echo "up" || echo "down")
          echo "pmg:${STATUS}:${MS}" >> "$GITHUB_WORKSPACE/.hc-results"

      - name: Check Docs
        run: |
          START=$(date +%s%N)
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            --connect-timeout 10 \
            https://docs.archmox.acreetionos.org/ || echo "000")
          END=$(date +%s%N)
          MS=$(( (END - START) / 1000000 ))
          STATUS=$([ "$HTTP_CODE" = "200" ] && echo "up" || echo "down")
          echo "docs:${STATUS}:${MS}" >> "$GITHUB_WORKSPACE/.hc-results"

      - name: Check CDN
        run: |
          START=$(date +%s%N)
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            --connect-timeout 10 \
            https://cdn.archmox.acreetionos.org/ || echo "000")
          END=$(date +%s%N)
          MS=$(( (END - START) / 1000000 ))
          STATUS=$([ "$HTTP_CODE" = "200" ] && echo "up" || echo "down")
          echo "cdn:${STATUS}:${MS}" >> "$GITHUB_WORKSPACE/.hc-results"

      - name: Assess overall health
        id: assess
        run: |
          ALL_UP=true
          SUMMARY=""
          OUT="$GITHUB_OUTPUT"

          # Results file lines look like: <service>:<up|down>:<milliseconds>
          while IFS=':' read -r service status ms; do
            [[ -z "${service}" ]] && continue
            echo "${service}_status=${status}" >> "${OUT}"
            echo "${service}_ms=${ms}" >> "${OUT}"
            if [ "${status}" != "up" ]; then
              ALL_UP=false
              SUMMARY="${SUMMARY}\n  ❌ ${service}: ${status} (${ms}ms)"
            else
              SUMMARY="${SUMMARY}\n  ✅ ${service}: ${status} (${ms}ms)"
            fi
          done < "$GITHUB_WORKSPACE/.hc-results"

          echo "all_healthy=${ALL_UP}" >> "${OUT}"
          echo "summary=${SUMMARY}" >> "${OUT}"

          echo "::notice::Fleet Health Summary:${SUMMARY}"

  notify-health:
    name: Notify on Health Issues
    needs: check-fleet
    if: |
      always() &&
      (needs.check-fleet.outputs.all_healthy == 'false' ||
       github.event.inputs.notify == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        if: env.DISCORD_WEBHOOK != ''
        run: |
          HEALTHY="${{ needs.check-fleet.outputs.all_healthy }}"
          SUMMARY="${{ needs.check-fleet.outputs.summary }}"
          STATUS_ICON="$([ "$HEALTHY" = "true" ] && echo "✅" || echo "❌")"
          curl -X POST -H "Content-Type: application/json" \
            -d "{
              \"content\": \"${STATUS_ICON} **Archmox Fleet Health Check**\n\`\`\`\n${SUMMARY}\n\`\`\`\"
            }" \
            "$DISCORD_WEBHOOK"

  record-metrics:
    name: Record Health Metrics
    needs: check-fleet
    runs-on: ubuntu-latest
    steps:
      - name: Store in KV (via API)
        run: |
          curl -s -X POST \
            "https://archmox.acreetionos.org/api/health/record" \
            -H "Content-Type: application/json" \
            -d '{
              "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
              "source": "github-actions",
              "results": {
                "main": "${{ needs.check-fleet.outputs.main_status }}-${{ needs.check-fleet.outputs.main_ms }}ms",
                "pve": "${{ needs.check-fleet.outputs.pve_status }}-${{ needs.check-fleet.outputs.pve_ms }}ms",
                "pbs": "${{ needs.check-fleet.outputs.pbs_status }}-${{ needs.check-fleet.outputs.pbs_ms }}ms",
                "pmg": "${{ needs.check-fleet.outputs.pmg_status }}-${{ needs.check-fleet.outputs.pmg_ms }}ms",
                "docs": "${{ needs.check-fleet.outputs.docs_status }}-${{ needs.check-fleet.outputs.docs_ms }}ms",
                "cdn": "${{ needs.check-fleet.outputs.cdn_status }}-${{ needs.check-fleet.outputs.cdn_ms }}ms"
              }
            }' || true
