# GRUB — Archmox ISO (UEFI). mkarchiso substitutes %ARCHISO_LABEL%,
# %INSTALL_DIR% and %ARCH% at build time.
insmod part_gpt
insmod fat
insmod search_fs_uuid
insmod chain
search --no-floppy --fs-uuid --set=root %ARCHISO_UUID%

set timeout=15
set default=0

menuentry "Archmox install/medium (%ARCH%, BIOS)" --class archmox --class gnu-linux {
	set gfxpayload=keep
	linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-lts archisobasedir=%INSTALL_DIR% archisodevice=UUID=%ARCHISO_UUID%
	initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-lts.img
}

menuentry "Archmox install medium (%ARCH%, BIOS) with speakup screen reader" --class archmox --class gnu-linux {
	set gfxpayload=keep
	linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-lts archisobasedir=%INSTALL_DIR% archisodevice=UUID=%ARCHISO_UUID% accessibility=on
	initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-lts.img
}

menuentry "Archmox RAM memory test (memtest86+)" --class memtest {
	linux /%INSTALL_DIR%/boot/memtest86+/memtest.bin
}

menuentry "System restart" {
	reboot
}

menuentry "System shutdown" {
	halt
}
