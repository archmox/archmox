# Syslinux — Archmox ISO (BIOS). mkarchiso substitutes %ARCHISO_LABEL%,
# %INSTALL_DIR% and %ARCH% at build time.
DEFAULT menu.c32
PROMPT 0
MENU TITLE Archmox — Proxmox stack on Arch Linux
TIMEOUT 150

LABEL archmox
MENU LABEL Archmox install/medium (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-lts
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-lts.img
APPEND archisobasedir=%INSTALL_DIR% archisodevice=UUID=%ARCHISO_UUID%

LABEL archmox-accessibility
MENU LABEL Archmox install medium (%ARCH%, BIOS) with speakup screen reader
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-lts
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-lts.img
APPEND archisobasedir=%INSTALL_DIR% archisodevice=UUID=%ARCHISO_UUID% accessibility=on

LABEL memtest
MENU LABEL RAM memory test (memtest86+)
LINUX /%INSTALL_DIR%/boot/memtest86+/memtest.bin

LABEL reboot
MENU LABEL System restart
COM32 reboot.c32

LABEL poweroff
MENU LABEL System shutdown
COM32 poweroff.c32
