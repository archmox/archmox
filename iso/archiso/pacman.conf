#
# pacman.conf — pacman configuration used by mkarchiso while building the
# Archmox ISO. The [archmox] section is appended automatically by
# scripts/release/make-iso.sh when built-in packages are available.
#
[options]
HoldPkg     = pacman glibc
Architecture = auto
CheckSpace
ParallelDownloads = 10
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
