# archmox fleet: map incoming Host -> Cloudflare Pages deployment
map $host $archmox_pages_upstream {
    default                        archmox.pages.dev;
    archmox.acreetionos.org        archmox.pages.dev;
    pve.archmox.acreetionos.org    archmox-pve.pages.dev;
    pbs.archmox.acreetionos.org    archmox-pbs.pages.dev;
    pmg.archmox.acreetionos.org    archmox-pmg.pages.dev;
    cdn.archmox.acreetionos.org    archmox-cdn.pages.dev;
    docs.archmox.acreetionos.org   archmox-docs.pages.dev;
}
